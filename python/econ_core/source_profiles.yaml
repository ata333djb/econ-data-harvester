fields:
  source:
    meaning: "数据源标识（nbs / worldbank / imf，统一小写）"
    origin: "normalize 的 SOURCE / SOURCE_WB 常量，或各 normalizer 的 source_meta.source"
  series_key:
    meaning: "序列键。形如 source|region_code|indicator_id（自动推导）或 source|family|name（声明式清单）"
    origin: "tools/scan-missing.py 的声明式清单；落盘文件的 series_key 字段优先，否则 missing._auto_series_key 推导"
  region_code:
    meaning: "地区代码。NBS 是 12 位数字（000000000000=全国），World Bank / IMF 是 ISO3（CHN）"
  region_name:
    meaning: "地区名称（NBS 不返回，由调用方传入；World Bank / IMF 从响应取）"
  indicator_id:
    meaning: "指标标识。NBS 是树节点 _id；World Bank / IMF 是指标代码；CPI 是 du#序号（du 为数据单位 id，多条序列共用）"
  indicator_name:
    meaning: "指标名称。可能为 null（实测 NBS 2024 年 GDP 行的 i_name 为 null），normalize 会用同 indicator_id 的名称补齐"
  period:
    meaning: "标准化观测期。年度 2015 / 月度 2015-01 / 季度 2015-Q1"
  period_type:
    meaning: "annual | monthly | quarterly"
  value:
    meaning: "观测值（float）。**缺失行为 null / 空串 / NULL，本项目不做任何插值**"
  unit:
    meaning: "单位。NBS 用「亿元 / % / 指数(上年=100) / 无」；World Bank 的 unit 字段常为空串（单位写在指标名里）；IMF 由知识库补（如 十亿美元）"
  fetched_at:
    meaning: "抓取时刻（ISO8601 UTC），来自 http_client 落盘时的记录"
  raw_cache:
    meaning: "原始响应存档路径（data/raw/_http_cache/*.bin），可回溯 HTTP 原文"
  row_sha16:
    meaning: "行级指纹：本行规范化 JSON（不含 row_sha16 自身）的 sha256 前 16 位。任何字段变动都会改变指纹"
  raw_fields:
    meaning: "原始记录中未被消费的字段（JSON 字符串）。NBS 保留 dt/dt_name/du/i/i_name/code；World Bank 保留 date/country/decimal 等；补齐行带 padded=true"
  missing_classification:
    meaning: "缺失分类：true_gap | not_yet_published | discontinued | series_start"
    origin: "econ_core.missing.classify_missing，由 fill_strategy 贴到行上"
  missing_action:
    meaning: "建议动作：interpolate | wait | leave_null | manual_review"
    origin: "econ_core.fill_strategy.decide（当前数据集里没有 true_gap，所以只出现 leave_null / wait）"
  missing_evidence:
    meaning: "分类依据（人可读），例如「位于序列末尾，缺失 3 期（约 3.00 年）；达到 >=3 年的停更阈值」"
  aggregated_from_months:
    meaning: "非标准列（仅调查失业率有）：该年由几个月度观测算术平均得到"
    origin: "tools/scan-missing.py 的月度->年均聚合；已参与 row_sha16 计算"



