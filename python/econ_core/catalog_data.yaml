# catalog_data.yaml —— 指标目录（用户产品的第一层）
#
# 这个文件回答一个问题：**用户说出一个指标名，哪个源能给他数据、要什么参数。**
#
# 读它的代码是 python/econ_core/catalog.py；CLI 是 tools/edh.py（list / info）。
#
# ============================================================================
# 本文件是「人工编纂 + 机器验证」的
# ============================================================================
# 每一条 source 映射都由 python/_probes/probe_catalog_sources.py 真跑过一次取数确认，
# 证据落在 data/raw/_probe_catalog/（data/ 被 gitignore，属于可再生的取证产物）：
#
#   verified.json     56 条映射的逐条结果（行数 / **非空值数** / 首末样本）
#   nbs_index.json    NBS 三个目录树拍平后的全部 78946 个节点
#   nbs_targets.json  18 个目标指标在 NBS 树里的候选三元组
#   diag_range.json   已停更序列的精确停更期（FDI）
#   bis_dataflows.json / bis_probe.json / fred_probe.json / imf_index.json
#   wb_index.json     World Bank 全量指标目录 29544 条
#
# 复核方式：
#   .\.venv\Scripts\python.exe python\_probes\probe_catalog_sources.py verify
#
# ============================================================================
# NBS 三个 UUID 的确切含义（实测，别再猜）
# ============================================================================
#   cid           指标节点的父目录节点 _id（树里的 treeinfo_pid）。
#                 **后端取数时忽略它**（PROJECT_STATE §3.1），但取目录树要用。
#   indicator_id  指标叶节点自身的 _id（即 tree==indicator 的那个节点）。
#                 fetch_indicator_data 的形参叫 indicator_id，scan-missing.py 里叫 tree_node。
#   root_id       **不是**指标的祖先，而是「该目录第一条 level-2 类目」的 _id，三个目录各一个常量：
#                 月度 code=1 -> 3c9c459384c74f578f3541b2198aac70（价格指数）
#                 季度 code=2 -> 1b1ce0cfd03646dc9e15103ea4c570f6（国民经济核算）
#                 年度 code=3 -> 71d41888d5a44bb2a67402ef4e60003e（综合）
#
# ============================================================================
# 缺源 = 键不存在，不是值写 null
# ============================================================================
# 与信封契约（PROJECT_STATE §2.2）同一原则。GOVERNMENT_DEBT 下面没有 nbs 键，
# 就表示 NBS 不提供这个指标 —— 实测 NBS 目录树里「政府债务」0 命中，
# 而「国债发行额 (亿元)」是**发行量**不是债务余额，口径不同，不能顶替。
#
# ============================================================================
# 别名必须全局唯一（加载时会强制）
# ============================================================================
# 需求清单里 CPI 与 INFLATION 都想要 "inflation" 这个别名。冲突必须拆开：
#   CPI       -> cpi / 消费价格 / consumer price index
#   INFLATION -> inflation / 通胀 / 通胀率 / 通货膨胀率

# ============================================================================
# kb_series_key —— 把目录接到知识库（验证链路）上的那根线
# ============================================================================
# 本文件的键是 **CPI / GDP / POPULATION**（人话），而 source_profiles.yaml 的键是
# **nbs|cpi|全国居民消费价格指数（上年=100） (%)**（规范键）。两套键不打通，
# `source_profiler.profile_series()` 就抛 KeyError —— `kb_series_key` 就是这条映射：
# 每个源条目（含 variants）声明自己在知识库里的规范键。
#
# 规则：
#   * **null = 知识库没有对应条目**，不是"还没填"。`edh export` 会跳过这些行并报出来。
#     不是所有目录指标都需要进知识库 —— 只有要做画像/判定/评分的才需要（知识库是人工编纂的，§2.8）
#   * **只有"同一个源 + 同一个统计口径"才算对上**。反例：NBS 是「上年=100」的年度指数，
#     World Bank 是「2010=100」的指数 —— 都叫 CPI 但不是同一条序列，故 WB 那行为 null
#   * 知识库里 **3 个条目在目录里没有对应项**：`nbs|cpi|城市…`、`nbs|cpi|农村…`
#     （目录只收了全国口径的 CPI）—— 它们暂时无法从 `edh` 侧落盘
#
# 覆盖率（2026-09-28 实测）：51 条源映射 + 6 个 variant = **57 处**，
# 其中 **12 处映射到知识库**（GDP×3、GDP_GROWTH×2、CPI×3、INFLATION×1、
# UNEMPLOYMENT×3 含 registered variant），45 处为 null。

meta:
  name: EconDataHarvester 指标目录
  version: 1
  updated: 2026-09-27
  n_indicators: 18
  n_source_mappings: 51
  sources: [nbs, worldbank, imf, fred, bis]
  verified_by: python/_probes/probe_catalog_sources.py (verify 阶段，真跑取数)
  n_verified_ok: 53
  note: >
    51 条映射每一条都真跑过一次取数（证据 verified.json）。53 = 51 条映射 + 2 条
    `variants`（CPI 的 NBS 月度、失业率的 NBS 登记口径）—— probe 脚本按"一次请求"计数，
    本文件按"一个源"计数，所以两个数字不同，不是对不上。标了 notes 的几处是
    **有数据但有限制**，不是"没验证"：NBS 外商直接投资停更于 2019-11；
    FRED 的 M2 止于 2019-08。
  probed_unavailable: >
    下面 3 条**探过并且确认对中国取不到数据**，因此没有收录进任何指标。
    它们留在 probe 脚本的 VERIFY_MAP 里（标 expect_unavailable）并记进 verified.json，
    目的是让"探过、结论是不可用"这件事留痕，后人不必重探：
      imf|BX_GDP                    出口占 GDP 比重 —— 对 CHN 返回 **0 行**
      imf|BM_GDP                    进口占 GDP 比重 —— 对 CHN 返回 **0 行**
      worldbank|GC.DOD.TOTL.GD.ZS    中央政府债务 —— 1960-2025 共 66 行**全为 null**

