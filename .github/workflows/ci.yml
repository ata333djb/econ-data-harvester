name: offline checks

# The full gate (tools/run-all-checks.py) needs network access: it really calls
# NBS / World Bank / IMF / FRED / BIS and asserts on the responses. That makes it
# unsuitable for CI -- it would fail on rate limits, upstream hiccups and
# maintenance windows, and a red badge would stop meaning "you broke something".
#
# So CI runs the subset that is genuinely deterministic, plus the cheap static
# checks. The authoritative gate is still run locally before release; see
# docs/ENGINEERING_NOTES.md section 7.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor, not a preference: the code uses PEP 701 f-strings
        # (nested same-type quotes inside an f-string expression), which is a
        # syntax error on 3.11 and earlier. This matrix started as
        # ["3.11", "3.12"] and the 3.11 leg failed to even byte-compile --
        # which is how the real requirement was discovered.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile every module
        run: python -m compileall -q python tools

      - name: Self-checks that need no network
        env:
          PYTHONPATH: python
          PYTHONIOENCODING: utf-8
          # The HTTP layer refuses to run on a "non-project-venv" interpreter,
          # because on the original development machine only a Python carrying
          # its own OpenSSL could reach the data sources (broken Windows
          # Schannel credential store, see docs/ENGINEERING_NOTES.md 2.1).
          # That reasoning does not transfer to a Linux CI runner, where the
          # system OpenSSL is fine -- and there is no .venv here to detect.
          # dist/edh.bat sets the same variable for the same reason.
          ECON_HTTP_ALLOW_NON_VENV: "1"
        run: |
          python -m econ_core.normalize --test
          python -m econ_core.cross_validation --test
          python -m econ_core.splicer --test
          python -m econ_core.catalog --test
          python -m econ_core.source_profiler --test
          python -m econ_core.missing --test

      - name: Indicator catalog loads and the CLI renders it
        env:
          PYTHONPATH: python
          PYTHONIOENCODING: utf-8
          ECON_HTTP_ALLOW_NON_VENV: "1"
        run: |
          python tools/edh.py list
          python tools/edh.py info CPI

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check the plugin shims
        run: |
          for f in src/plugins/*.js tools/*.mjs; do
            node --check "$f"
          done
